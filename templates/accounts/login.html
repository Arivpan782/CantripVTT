{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="container" style="max-width: 500px;">

    <h1 class="text-moss fw-bold mb-4 text-center">Iniciar sesión</h1>

    <form method="post" class="card p-4 shadow-sm bg-stone-dark text-main">
        {% csrf_token %}

        {% for field in form %}
            <div class="mb-3">
                <label class="form-label text-moss fw-bold">{{ field.label }}</label>
                {{ field }}
                {% for error in field.errors %}
                    <div class="text-danger small">{{ error }}</div>
                {% endfor %}
            </div>
        {% endfor %}

        <button type="submit" class="btn btn-moss w-100 mt-3">
            Entrar
        </button>
    </form>

    <div class="text-center mt-4">
        <a href="{% url 'register' %}" class="text-moss fw-bold">Crear cuenta</a>
    </div>

</div>
{% endblock %}
