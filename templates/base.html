{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mi Proyecto{% endblock %}</title>

    <!-- CSS global -->
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">

    {% block extra_css %}{% endblock %}
</head>

<body>

    <header>
        <nav>
            <a href="">Inicio</a>
            <a href="{% url 'login' %}">Login</a>
            <a href="{% url 'logout' %}">Logout</a>
            <a href="{% url 'register' %}">Register</a>
            <a href="{% url 'campaign_create' %}">Crear Campañas</a>
            <a href="{% url 'campaign_list' %}">Mis Campañas</a>
            <a href="{% url 'character_create' %}">Crear Personajes</a>
            <a href="{% url 'character_list' %}">Mis Personajes</a>
            <a href="{% url 'admin:index' %}">Admin</a>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>&copy; {{ year }} Mi Proyecto</p>
    </footer>

    {% block extra_js %}{% endblock %}
</body>
</html>
