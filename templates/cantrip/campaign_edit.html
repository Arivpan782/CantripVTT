{% extends "base.html" %}

{% block title %}Editar campaña{% endblock %}

{% block content %}
<h1>Editar campaña: {{ campaign.name }}</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit">Guardar cambios</button>
</form>

<a href="{% url 'campaign_detail' campaign.pk %}">Volver a detalles</a>
{% endblock %}
