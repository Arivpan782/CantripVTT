{% extends "base.html" %}

{% block title %}Borrar campaña{% endblock %}

{% block content %}
<h1>Borrar campaña: {{ campaign.name }}</h1>

<p>Esta acción no se puede deshacer.</p>
<p>Para confirmar, escribe <strong>DELETE</strong>:</p>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" style="color: red;">Borrar campaña</button>
</form>

<a href="{% url 'campaign_detail' campaign.pk %}">Cancelar</a>
{% endblock %}
